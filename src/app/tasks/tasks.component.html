<div *ngIf="showAddTaskModal">
  <app-new-task (cancel)="onCancelAddTask()" (add)="addTask($event)"/>
</div>
<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
    <menu>
      <button (click)="showAddTask()">Add task</button>
    </menu>
  </header>
  <ul>
    <li *ngFor="let task of selectedTasks">
      <app-task (completed)="deleteTask($event)" [task]="task"/>
    </li>
  </ul>
</section>
